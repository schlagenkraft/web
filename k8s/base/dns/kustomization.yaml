apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Don't override namespace - let resources define their own

resources:
  - namespace.yaml
  - service-account.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  # Secret must be created manually - see setup-secrets.sh
  # - secret.yaml
  - external-dns.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: ski-website
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false