apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ski-website

resources:
  - namespace.yaml
  - service.yaml
  - deployment.yaml
  - ingress.yaml

labels:
  - pairs:
      app: ski-website
      managed-by: kustomize
    includeSelectors: true

images:
  - name: ghcr.io/schlagenkraft/web/ski-website
    newTag: simple