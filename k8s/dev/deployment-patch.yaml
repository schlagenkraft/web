apiVersion: apps/v1
kind: Deployment
metadata:
  name: ski-website
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: nginx
        image: ghcr.io/schlagenkraft/web/ski-website:master-8a4b417
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi