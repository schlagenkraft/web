apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Don't override namespace - resources define their own

resources:
  - ../base

namePrefix: dev-

labels:
  - pairs:
      environment: development
    includeSelectors: false

images:
  - name: ghcr.io/schlagenkraft/web/ski-website
    newTag: simple

replicas:
  - name: ski-website
    count: 1

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: ski-website